# Worker-only. Merged after docker-compose.dspark.yml when DSPARK_WORKER_HF_NFS=1.
# Replaces the host HF bind with a read-only NFS volume of the head cache, and
# overlays the local writable runtime-assets volume for JIT/vLLM caches.
# The named volume is created by start-deepseek-v4-flash-dspark.sh (nfs_ensure_worker_volume).
services:
  vllm-dspark:
    volumes:
      - dspark-hf:/cache/huggingface:ro
      - ${RUNTIME_ASSETS:-${DSPARK_JIT_CACHE}/runtime_assets}:/runtime_assets

volumes:
  dspark-hf:
    external: true
